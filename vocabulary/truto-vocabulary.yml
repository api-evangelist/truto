method: generated
vocabulary:
  - term: Unified API
    definition: >-
      A single normalized API interface that abstracts multiple underlying third-party
      API providers behind a consistent schema and endpoint structure. Truto's Unified
      APIs (HRIS, ATS, CRM) allow reading and writing data from any supported provider
      using the same requests and response models regardless of the underlying system.
    tags:
      - Core Concept
      - Integration Platform

  - term: Integrated Account
    definition: >-
      A connection record in Truto representing a link between a Truto tenant and a
      customer's connected third-party application. Created at the end of an account
      connection flow (link token flow) or programmatically via the Admin API. Used
      as the integrated_account_id parameter in Unified API requests.
    tags:
      - Admin API
      - Core Concept

  - term: Link Token
    definition: >-
      A short-lived credential generated by the Truto Admin API to initiate a
      customer-facing OAuth or API key connection flow. The link token is passed to
      the Truto Link SDK or redirect URL to guide the end user through connecting
      their account. An integrated account is created when the flow completes.
    tags:
      - Admin API
      - Authentication
      - OAuth

  - term: Pass-Through
    definition: >-
      Truto's real-time data access model where API calls are forwarded directly to
      the underlying provider API as they are made. No data is cached or stored in
      Truto — customer data flows directly from the source system to the caller.
    tags:
      - Architecture
      - Data Privacy

  - term: Proxy API
    definition: >-
      A Truto API mode that provides a 1-to-1 mapping of the underlying provider's
      native API, with Truto handling authentication (OAuth refresh, credential management,
      base URL resolution) transparently. Used when the Unified API doesn't cover a
      specific provider endpoint.
    tags:
      - Architecture
      - Integration

  - term: MCP Server
    definition: >-
      A Model Context Protocol server provisioned by Truto for an integrated account,
      providing AI agents (Claude, ChatGPT, custom LLM frameworks) with direct tool
      access to the connected integration. Provisioned via a single API call and
      accessed via a secure tokenized URL.
    tags:
      - AI Agents
      - MCP
      - Integration Platform

  - term: JSONata
    definition: >-
      A lightweight JSON query and transformation language used by Truto for schema
      mappings and customizations. Every Truto unified model field mapping is expressed
      in JSONata, allowing developers to customize how data from underlying APIs is
      transformed into the normalized unified schema without code deploys.
    tags:
      - Configuration
      - Schema Mapping
      - Architecture

  - term: Post-Install Actions
    definition: >-
      Automated actions that run when an integrated account is first connected. Typically
      used to fetch metadata from the underlying API (e.g., tenant ID, subdomain, region)
      and store it in the integrated account's context field. Can be re-run manually via
      the Admin API.
    tags:
      - Admin API
      - Integrated Accounts

  - term: HRIS
    definition: >-
      Human Resource Information System. Truto's Unified HRIS API normalizes HR data
      (employees, employments, departments, time off) across 41 HRIS providers including
      BambooHR, Workday, Rippling, Gusto, HiBob, Personio, Oracle Fusion Cloud HCM,
      and others into 20 unified resources.
    tags:
      - HRIS
      - Unified API

  - term: ATS
    definition: >-
      Applicant Tracking System. Truto's Unified ATS API normalizes recruiting data
      (jobs, candidates, applications, interviews, offers) across 27 ATS providers
      including Greenhouse, Lever, Workable, SmartRecruiters, Ashby, Teamtailor,
      and others into 17 unified resources.
    tags:
      - ATS
      - Recruiting
      - Unified API

  - term: CRM
    definition: >-
      Customer Relationship Management. Truto's Unified CRM API normalizes sales and
      customer data (contacts, accounts, opportunities, tasks, stages) across 27 CRM
      providers including Salesforce, HubSpot, Pipedrive, Attio, Outreach, and others
      into 17 unified resources.
    tags:
      - CRM
      - Sales
      - Unified API

  - term: Embedded Integration
    definition: >-
      A native integration built into a B2B SaaS product that allows end users to connect
      their own third-party accounts (e.g., their BambooHR, Greenhouse, or Salesforce
      instance) to the product's features. Truto enables embedded integrations without
      integration-specific code via its declarative connector architecture.
    tags:
      - Embedded Integrations
      - B2B SaaS

  - term: Cursor Pagination
    definition: >-
      The pagination model used by Truto Unified APIs, where list endpoints return a
      nextCursor field in the response. Pass this cursor as the cursor query parameter
      in the next request to retrieve the subsequent page of results. More reliable than
      offset pagination for real-time data.
    tags:
      - Pagination
      - API Design

  - term: integrated_account_id
    definition: >-
      A required query parameter on all Truto Unified API requests that specifies which
      connected provider instance to query. Corresponds to the id field of an integrated
      account. Allows a single Truto tenant to manage and query data across many customers'
      connected accounts.
    tags:
      - Authentication
      - Unified API
      - Query Parameters

  - term: remoteId
    definition: >-
      The native identifier of a resource in the source third-party system (e.g., the
      employee ID in BambooHR, the candidate ID in Greenhouse). Returned alongside
      Truto's unified id in API responses to allow mapping back to the originating system.
    tags:
      - Data Model
      - Unified API
