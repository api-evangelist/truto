naftiko: 1.0.0-alpha2
info:
  label: Truto Admin API — MCP Servers
  description: 'Truto Admin API — MCP Servers. 1 operations. Lead operation: Create MCP server for integrated account. Self-contained
    Naftiko capability covering one Truto business surface.'
  tags:
  - Truto
  - MCP Servers
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    TRUTO_API_KEY: TRUTO_API_KEY
capability:
  consumes:
  - type: http
    namespace: admin-mcp-servers
    baseUri: https://api.truto.one
    description: Truto Admin API — MCP Servers business capability. Self-contained, no shared references.
    resources:
    - name: integrated-accounts-id-mcp
      path: /integrated-accounts/{id}/mcp
      operations:
      - name: createmcpserver
        method: POST
        description: Create MCP server for integrated account
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: id
          in: path
          type: string
          description: Integrated account identifier.
          required: true
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: false
    authentication:
      type: bearer
      token: '{{env.TRUTO_API_KEY}}'
  exposes:
  - type: rest
    namespace: admin-mcp-servers-rest
    port: 8080
    description: REST adapter for Truto Admin API — MCP Servers. One Spectral-compliant resource per consumed operation, prefixed
      with /v1.
    resources:
    - path: /v1/integrated-accounts/{id}/mcp
      name: integrated-accounts-id-mcp
      description: REST surface for integrated-accounts-id-mcp.
      operations:
      - method: POST
        name: createmcpserver
        description: Create MCP server for integrated account
        call: admin-mcp-servers.createmcpserver
        with:
          id: rest.id
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: admin-mcp-servers-mcp
    port: 9090
    transport: http
    description: MCP adapter for Truto Admin API — MCP Servers. One tool per consumed operation, routed inline through this
      capability's consumes block.
    tools:
    - name: create-mcp-server-integrated-account
      description: Create MCP server for integrated account
      hints:
        readOnly: false
        destructive: false
        idempotent: false
      call: admin-mcp-servers.createmcpserver
      with:
        id: tools.id
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
