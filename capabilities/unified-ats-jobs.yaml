naftiko: 1.0.0-alpha2
info:
  label: Truto Unified ATS API — Jobs
  description: 'Truto Unified ATS API — Jobs. 2 operations. Lead operation: List jobs. Self-contained Naftiko capability covering
    one Truto business surface.'
  tags:
  - Truto
  - Jobs
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    TRUTO_API_KEY: TRUTO_API_KEY
capability:
  consumes:
  - type: http
    namespace: unified-ats-jobs
    baseUri: https://api.truto.one/unified/ats
    description: Truto Unified ATS API — Jobs business capability. Self-contained, no shared references.
    resources:
    - name: jobs
      path: /jobs
      operations:
      - name: listjobs
        method: GET
        description: List jobs
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: status
          in: query
          type: string
          description: Filter jobs by status.
        - name: department_id
          in: query
          type: string
          description: Filter jobs by department ID.
        - name: cursor
          in: query
          type: string
        - name: limit
          in: query
          type: integer
    - name: jobs-id
      path: /jobs/{id}
      operations:
      - name: getjob
        method: GET
        description: Get job
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: id
          in: path
          type: string
          required: true
    authentication:
      type: bearer
      token: '{{env.TRUTO_API_KEY}}'
  exposes:
  - type: rest
    namespace: unified-ats-jobs-rest
    port: 8080
    description: REST adapter for Truto Unified ATS API — Jobs. One Spectral-compliant resource per consumed operation, prefixed
      with /v1.
    resources:
    - path: /v1/jobs
      name: jobs
      description: REST surface for jobs.
      operations:
      - method: GET
        name: listjobs
        description: List jobs
        call: unified-ats-jobs.listjobs
        with:
          status: rest.status
          department_id: rest.department_id
          cursor: rest.cursor
          limit: rest.limit
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/jobs/{id}
      name: jobs-id
      description: REST surface for jobs-id.
      operations:
      - method: GET
        name: getjob
        description: Get job
        call: unified-ats-jobs.getjob
        with:
          id: rest.id
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: unified-ats-jobs-mcp
    port: 9090
    transport: http
    description: MCP adapter for Truto Unified ATS API — Jobs. One tool per consumed operation, routed inline through this
      capability's consumes block.
    tools:
    - name: list-jobs
      description: List jobs
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: unified-ats-jobs.listjobs
      with:
        status: tools.status
        department_id: tools.department_id
        cursor: tools.cursor
        limit: tools.limit
      outputParameters:
      - type: object
        mapping: $.
    - name: get-job
      description: Get job
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: unified-ats-jobs.getjob
      with:
        id: tools.id
      outputParameters:
      - type: object
        mapping: $.
