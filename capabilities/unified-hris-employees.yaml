naftiko: 1.0.0-alpha2
info:
  label: Truto Unified HRIS API — Employees
  description: 'Truto Unified HRIS API — Employees. 2 operations. Lead operation: List employees. Self-contained Naftiko capability
    covering one Truto business surface.'
  tags:
  - Truto
  - Employees
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    TRUTO_API_KEY: TRUTO_API_KEY
capability:
  consumes:
  - type: http
    namespace: unified-hris-employees
    baseUri: https://api.truto.one/unified/hris
    description: Truto Unified HRIS API — Employees business capability. Self-contained, no shared references.
    resources:
    - name: employees
      path: /employees
      operations:
      - name: listemployees
        method: GET
        description: List employees
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: status
          in: query
          type: string
          description: Filter employees by employment status.
        - name: department_id
          in: query
          type: string
          description: Filter employees by department ID.
        - name: cursor
          in: query
          type: string
          description: Cursor for pagination (from previous response next_cursor).
        - name: limit
          in: query
          type: integer
          description: Number of results per page (max 100).
    - name: employees-id
      path: /employees/{id}
      operations:
      - name: getemployee
        method: GET
        description: Get employee
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: id
          in: path
          type: string
          description: Employee identifier.
          required: true
    authentication:
      type: bearer
      token: '{{env.TRUTO_API_KEY}}'
  exposes:
  - type: rest
    namespace: unified-hris-employees-rest
    port: 8080
    description: REST adapter for Truto Unified HRIS API — Employees. One Spectral-compliant resource per consumed operation,
      prefixed with /v1.
    resources:
    - path: /v1/employees
      name: employees
      description: REST surface for employees.
      operations:
      - method: GET
        name: listemployees
        description: List employees
        call: unified-hris-employees.listemployees
        with:
          status: rest.status
          department_id: rest.department_id
          cursor: rest.cursor
          limit: rest.limit
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/employees/{id}
      name: employees-id
      description: REST surface for employees-id.
      operations:
      - method: GET
        name: getemployee
        description: Get employee
        call: unified-hris-employees.getemployee
        with:
          id: rest.id
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: unified-hris-employees-mcp
    port: 9090
    transport: http
    description: MCP adapter for Truto Unified HRIS API — Employees. One tool per consumed operation, routed inline through
      this capability's consumes block.
    tools:
    - name: list-employees
      description: List employees
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: unified-hris-employees.listemployees
      with:
        status: tools.status
        department_id: tools.department_id
        cursor: tools.cursor
        limit: tools.limit
      outputParameters:
      - type: object
        mapping: $.
    - name: get-employee
      description: Get employee
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: unified-hris-employees.getemployee
      with:
        id: tools.id
      outputParameters:
      - type: object
        mapping: $.
