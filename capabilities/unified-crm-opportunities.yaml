naftiko: 1.0.0-alpha2
info:
  label: Truto Unified CRM API — Opportunities
  description: 'Truto Unified CRM API — Opportunities. 2 operations. Lead operation: List opportunities. Self-contained Naftiko
    capability covering one Truto business surface.'
  tags:
  - Truto
  - Opportunities
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    TRUTO_API_KEY: TRUTO_API_KEY
capability:
  consumes:
  - type: http
    namespace: unified-crm-opportunities
    baseUri: https://api.truto.one/unified/crm
    description: Truto Unified CRM API — Opportunities business capability. Self-contained, no shared references.
    resources:
    - name: opportunities
      path: /opportunities
      operations:
      - name: listopportunities
        method: GET
        description: List opportunities
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: account_id
          in: query
          type: string
          description: Filter by account ID.
        - name: stage_id
          in: query
          type: string
          description: Filter by pipeline stage ID.
        - name: status
          in: query
          type: string
          description: Filter by opportunity status.
        - name: cursor
          in: query
          type: string
        - name: limit
          in: query
          type: integer
      - name: createopportunity
        method: POST
        description: Create opportunity
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: true
    authentication:
      type: bearer
      token: '{{env.TRUTO_API_KEY}}'
  exposes:
  - type: rest
    namespace: unified-crm-opportunities-rest
    port: 8080
    description: REST adapter for Truto Unified CRM API — Opportunities. One Spectral-compliant resource per consumed operation,
      prefixed with /v1.
    resources:
    - path: /v1/opportunities
      name: opportunities
      description: REST surface for opportunities.
      operations:
      - method: GET
        name: listopportunities
        description: List opportunities
        call: unified-crm-opportunities.listopportunities
        with:
          account_id: rest.account_id
          stage_id: rest.stage_id
          status: rest.status
          cursor: rest.cursor
          limit: rest.limit
        outputParameters:
        - type: object
          mapping: $.
      - method: POST
        name: createopportunity
        description: Create opportunity
        call: unified-crm-opportunities.createopportunity
        with:
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: unified-crm-opportunities-mcp
    port: 9090
    transport: http
    description: MCP adapter for Truto Unified CRM API — Opportunities. One tool per consumed operation, routed inline through
      this capability's consumes block.
    tools:
    - name: list-opportunities
      description: List opportunities
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: unified-crm-opportunities.listopportunities
      with:
        account_id: tools.account_id
        stage_id: tools.stage_id
        status: tools.status
        cursor: tools.cursor
        limit: tools.limit
      outputParameters:
      - type: object
        mapping: $.
    - name: create-opportunity
      description: Create opportunity
      hints:
        readOnly: false
        destructive: false
        idempotent: false
      call: unified-crm-opportunities.createopportunity
      with:
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
