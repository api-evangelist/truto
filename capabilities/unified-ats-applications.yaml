naftiko: 1.0.0-alpha2
info:
  label: Truto Unified ATS API — Applications
  description: 'Truto Unified ATS API — Applications. 1 operations. Lead operation: List applications. Self-contained Naftiko
    capability covering one Truto business surface.'
  tags:
  - Truto
  - Applications
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    TRUTO_API_KEY: TRUTO_API_KEY
capability:
  consumes:
  - type: http
    namespace: unified-ats-applications
    baseUri: https://api.truto.one/unified/ats
    description: Truto Unified ATS API — Applications business capability. Self-contained, no shared references.
    resources:
    - name: applications
      path: /applications
      operations:
      - name: listapplications
        method: GET
        description: List applications
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: job_id
          in: query
          type: string
          description: Filter applications by job ID.
        - name: candidate_id
          in: query
          type: string
          description: Filter applications by candidate ID.
        - name: status
          in: query
          type: string
          description: Filter by application status.
        - name: cursor
          in: query
          type: string
        - name: limit
          in: query
          type: integer
    authentication:
      type: bearer
      token: '{{env.TRUTO_API_KEY}}'
  exposes:
  - type: rest
    namespace: unified-ats-applications-rest
    port: 8080
    description: REST adapter for Truto Unified ATS API — Applications. One Spectral-compliant resource per consumed operation,
      prefixed with /v1.
    resources:
    - path: /v1/applications
      name: applications
      description: REST surface for applications.
      operations:
      - method: GET
        name: listapplications
        description: List applications
        call: unified-ats-applications.listapplications
        with:
          job_id: rest.job_id
          candidate_id: rest.candidate_id
          status: rest.status
          cursor: rest.cursor
          limit: rest.limit
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: unified-ats-applications-mcp
    port: 9090
    transport: http
    description: MCP adapter for Truto Unified ATS API — Applications. One tool per consumed operation, routed inline through
      this capability's consumes block.
    tools:
    - name: list-applications
      description: List applications
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: unified-ats-applications.listapplications
      with:
        job_id: tools.job_id
        candidate_id: tools.candidate_id
        status: tools.status
        cursor: tools.cursor
        limit: tools.limit
      outputParameters:
      - type: object
        mapping: $.
