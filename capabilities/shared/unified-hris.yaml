naftiko: "1.0.0-alpha1"

info:
  label: "Truto Unified HRIS API"
  description: "Normalized HRIS data access across 41 providers including BambooHR, Workday, Rippling, Gusto, HiBob, and Personio via a single unified interface."
  tags:
    - HRIS
    - Human Resources
    - Employees
    - Unified API
    - Integration Platform
  created: "2026-05-03"
  modified: "2026-05-03"

binds:
  - namespace: env
    keys:
      TRUTO_API_TOKEN: TRUTO_API_TOKEN

capability:
  consumes:
    - type: http
      namespace: truto-hris
      baseUri: https://api.truto.one/unified/hris
      description: "Truto Unified HRIS API for normalized HR data access."
      authentication:
        type: bearer
        value: "{{TRUTO_API_TOKEN}}"
      resources:
        - name: employees
          path: /employees
          description: "Employee records"
          operations:
            - name: list-employees
              method: GET
              description: "List employees from the connected HRIS provider."
              inputParameters:
                - name: integrated_account_id
                  in: query
                  type: string
                  required: true
                - name: status
                  in: query
                  type: string
                  required: false
                - name: department_id
                  in: query
                  type: string
                  required: false
                - name: cursor
                  in: query
                  type: string
                  required: false
                - name: limit
                  in: query
                  type: integer
                  required: false
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
        - name: employee
          path: /employees/{id}
          description: "Single employee record"
          operations:
            - name: get-employee
              method: GET
              description: "Get a single employee by ID."
              inputParameters:
                - name: integrated_account_id
                  in: query
                  type: string
                  required: true
                - name: id
                  in: path
                  type: string
                  required: true
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
        - name: employments
          path: /employments
          description: "Employment records"
          operations:
            - name: list-employments
              method: GET
              description: "List employment records."
              inputParameters:
                - name: integrated_account_id
                  in: query
                  type: string
                  required: true
                - name: employee_id
                  in: query
                  type: string
                  required: false
                - name: cursor
                  in: query
                  type: string
                  required: false
                - name: limit
                  in: query
                  type: integer
                  required: false
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
        - name: groups
          path: /groups
          description: "Department and group records"
          operations:
            - name: list-groups
              method: GET
              description: "List groups (departments, teams)."
              inputParameters:
                - name: integrated_account_id
                  in: query
                  type: string
                  required: true
                - name: type
                  in: query
                  type: string
                  required: false
                - name: cursor
                  in: query
                  type: string
                  required: false
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
        - name: timeoff-requests
          path: /timeoff-requests
          description: "Time off requests"
          operations:
            - name: list-timeoff-requests
              method: GET
              description: "List time off requests."
              inputParameters:
                - name: integrated_account_id
                  in: query
                  type: string
                  required: true
                - name: employee_id
                  in: query
                  type: string
                  required: false
                - name: status
                  in: query
                  type: string
                  required: false
                - name: cursor
                  in: query
                  type: string
                  required: false
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."

  exposes:
    - type: rest
      port: 8101
      namespace: truto-hris-api
      resources:
        - path: /v1/hris/employees
          name: employees
          description: "Employee list"
          operations:
            - method: GET
              name: list-employees
              description: "List employees"
              call: "truto-hris.list-employees"
              outputParameters:
                - type: object
                  mapping: "$."
        - path: /v1/hris/employments
          name: employments
          description: "Employment records"
          operations:
            - method: GET
              name: list-employments
              description: "List employment records"
              call: "truto-hris.list-employments"
              outputParameters:
                - type: object
                  mapping: "$."
        - path: /v1/hris/groups
          name: groups
          description: "Groups and departments"
          operations:
            - method: GET
              name: list-groups
              description: "List groups"
              call: "truto-hris.list-groups"
              outputParameters:
                - type: object
                  mapping: "$."
        - path: /v1/hris/timeoff-requests
          name: timeoff-requests
          description: "Time off requests"
          operations:
            - method: GET
              name: list-timeoff-requests
              description: "List time off requests"
              call: "truto-hris.list-timeoff-requests"
              outputParameters:
                - type: object
                  mapping: "$."

    - type: mcp
      port: 9101
      namespace: truto-hris-mcp
      transport: http
      tools:
        - name: list-employees
          description: "List employees from a connected HRIS provider with optional status and department filtering."
          hints:
            readOnly: true
            openWorld: false
          call: "truto-hris.list-employees"
          with:
            integrated_account_id: "tools.integrated_account_id"
            status: "tools.status"
            department_id: "tools.department_id"
            cursor: "tools.cursor"
            limit: "tools.limit"
          outputParameters:
            - type: object
              mapping: "$."
        - name: get-employee
          description: "Get a single employee record by ID from a connected HRIS provider."
          hints:
            readOnly: true
            openWorld: false
          call: "truto-hris.get-employee"
          with:
            integrated_account_id: "tools.integrated_account_id"
            id: "tools.id"
          outputParameters:
            - type: object
              mapping: "$."
        - name: list-employments
          description: "List employment records (job titles, pay rates, employment type) from a connected HRIS provider."
          hints:
            readOnly: true
            openWorld: false
          call: "truto-hris.list-employments"
          with:
            integrated_account_id: "tools.integrated_account_id"
            employee_id: "tools.employee_id"
            cursor: "tools.cursor"
          outputParameters:
            - type: object
              mapping: "$."
        - name: list-groups
          description: "List departments, teams, and organizational groups from a connected HRIS provider."
          hints:
            readOnly: true
            openWorld: false
          call: "truto-hris.list-groups"
          with:
            integrated_account_id: "tools.integrated_account_id"
            type: "tools.type"
          outputParameters:
            - type: object
              mapping: "$."
        - name: list-timeoff-requests
          description: "List time off requests from a connected HRIS provider with employee and status filtering."
          hints:
            readOnly: true
            openWorld: false
          call: "truto-hris.list-timeoff-requests"
          with:
            integrated_account_id: "tools.integrated_account_id"
            employee_id: "tools.employee_id"
            status: "tools.status"
          outputParameters:
            - type: object
              mapping: "$."
