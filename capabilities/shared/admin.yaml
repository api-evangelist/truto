naftiko: "1.0.0-alpha1"

info:
  label: "Truto Admin API"
  description: "Manage integrated accounts, generate link tokens, and provision MCP servers on the Truto integration platform."
  tags:
    - Integration Platform
    - Administration
    - Integrated Accounts
    - MCP
    - Link Tokens
  created: "2026-05-03"
  modified: "2026-05-03"

binds:
  - namespace: env
    keys:
      TRUTO_API_TOKEN: TRUTO_API_TOKEN

capability:
  consumes:
    - type: http
      namespace: truto-admin
      baseUri: https://api.truto.one
      description: "Truto Admin API for managing integrated accounts and link tokens."
      authentication:
        type: bearer
        value: "{{TRUTO_API_TOKEN}}"
      resources:
        - name: integrated-accounts
          path: /integrated-accounts
          description: "Integrated account management"
          operations:
            - name: list-integrated-accounts
              method: GET
              description: "List all integrated accounts in the tenant."
              inputParameters:
                - name: integration
                  in: query
                  type: string
                  required: false
                - name: status
                  in: query
                  type: string
                  required: false
                - name: page
                  in: query
                  type: integer
                  required: false
                - name: limit
                  in: query
                  type: integer
                  required: false
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
            - name: create-integrated-account
              method: POST
              description: "Programmatically create an integrated account."
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
              body:
                type: json
                data:
                  integration: "{{tools.integration}}"
                  name: "{{tools.name}}"
                  credentials: "{{tools.credentials}}"
        - name: integrated-account
          path: /integrated-accounts/{id}
          description: "Single integrated account"
          operations:
            - name: get-integrated-account
              method: GET
              description: "Get a single integrated account by ID."
              inputParameters:
                - name: id
                  in: path
                  type: string
                  required: true
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
            - name: delete-integrated-account
              method: DELETE
              description: "Delete an integrated account."
              inputParameters:
                - name: id
                  in: path
                  type: string
                  required: true
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
        - name: mcp-server
          path: /integrated-accounts/{id}/mcp
          description: "MCP server provisioning"
          operations:
            - name: create-mcp-server
              method: POST
              description: "Provision an MCP server for an integrated account."
              inputParameters:
                - name: id
                  in: path
                  type: string
                  required: true
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
              body:
                type: json
                data:
                  allowedMethods: "{{tools.allowedMethods}}"
        - name: link-tokens
          path: /link-tokens
          description: "Link token generation"
          operations:
            - name: create-link-token
              method: POST
              description: "Generate a link token for customer-initiated account connection."
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
              body:
                type: json
                data:
                  integration: "{{tools.integration}}"
                  externalId: "{{tools.externalId}}"
                  redirectUri: "{{tools.redirectUri}}"

  exposes:
    - type: rest
      port: 8100
      namespace: truto-admin-api
      resources:
        - path: /v1/integrated-accounts
          name: integrated-accounts
          description: "Integrated account list"
          operations:
            - method: GET
              name: list-integrated-accounts
              description: "List integrated accounts"
              call: "truto-admin.list-integrated-accounts"
              outputParameters:
                - type: object
                  mapping: "$."
            - method: POST
              name: create-integrated-account
              description: "Create integrated account"
              call: "truto-admin.create-integrated-account"
              outputParameters:
                - type: object
                  mapping: "$."
        - path: /v1/link-tokens
          name: link-tokens
          description: "Link tokens"
          operations:
            - method: POST
              name: create-link-token
              description: "Create link token"
              call: "truto-admin.create-link-token"
              outputParameters:
                - type: object
                  mapping: "$."

    - type: mcp
      port: 9100
      namespace: truto-admin-mcp
      transport: http
      tools:
        - name: list-integrated-accounts
          description: "List all integrated accounts connected to your Truto tenant, with optional filtering by integration name and status."
          hints:
            readOnly: true
            openWorld: false
          call: "truto-admin.list-integrated-accounts"
          with:
            integration: "tools.integration"
            status: "tools.status"
          outputParameters:
            - type: object
              mapping: "$."
        - name: create-integrated-account
          description: "Programmatically register a new integrated account using existing credentials (API key or access token)."
          hints:
            readOnly: false
            openWorld: false
          call: "truto-admin.create-integrated-account"
          with:
            integration: "tools.integration"
            name: "tools.name"
            credentials: "tools.credentials"
          outputParameters:
            - type: object
              mapping: "$."
        - name: get-integrated-account
          description: "Get details of a specific integrated account including connection status and context metadata."
          hints:
            readOnly: true
            openWorld: false
          call: "truto-admin.get-integrated-account"
          with:
            id: "tools.id"
          outputParameters:
            - type: object
              mapping: "$."
        - name: create-mcp-server
          description: "Provision an MCP server for an integrated account so AI agents can access the integration as a set of tools."
          hints:
            readOnly: false
            openWorld: false
          call: "truto-admin.create-mcp-server"
          with:
            id: "tools.id"
            allowedMethods: "tools.allowedMethods"
          outputParameters:
            - type: object
              mapping: "$."
        - name: create-link-token
          description: "Generate a short-lived link token to initiate a customer-facing account connection flow for a specific integration."
          hints:
            readOnly: false
            openWorld: false
          call: "truto-admin.create-link-token"
          with:
            integration: "tools.integration"
            externalId: "tools.externalId"
            redirectUri: "tools.redirectUri"
          outputParameters:
            - type: object
              mapping: "$."
