naftiko: "1.0.0-alpha1"

info:
  label: "Truto Unified ATS API"
  description: "Normalized ATS data access across 27 providers including Greenhouse, Lever, Workable, SmartRecruiters, and Ashby via a single unified interface."
  tags:
    - ATS
    - Applicant Tracking
    - Recruiting
    - Unified API
    - Integration Platform
  created: "2026-05-03"
  modified: "2026-05-03"

binds:
  - namespace: env
    keys:
      TRUTO_API_TOKEN: TRUTO_API_TOKEN

capability:
  consumes:
    - type: http
      namespace: truto-ats
      baseUri: https://api.truto.one/unified/ats
      description: "Truto Unified ATS API for normalized recruiting data access."
      authentication:
        type: bearer
        value: "{{TRUTO_API_TOKEN}}"
      resources:
        - name: jobs
          path: /jobs
          description: "Job postings"
          operations:
            - name: list-jobs
              method: GET
              description: "List job postings."
              inputParameters:
                - name: integrated_account_id
                  in: query
                  type: string
                  required: true
                - name: status
                  in: query
                  type: string
                  required: false
                - name: department_id
                  in: query
                  type: string
                  required: false
                - name: cursor
                  in: query
                  type: string
                  required: false
                - name: limit
                  in: query
                  type: integer
                  required: false
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
        - name: candidates
          path: /candidates
          description: "Candidate profiles"
          operations:
            - name: list-candidates
              method: GET
              description: "List candidates."
              inputParameters:
                - name: integrated_account_id
                  in: query
                  type: string
                  required: true
                - name: cursor
                  in: query
                  type: string
                  required: false
                - name: limit
                  in: query
                  type: integer
                  required: false
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
        - name: candidate
          path: /candidates/{id}
          description: "Single candidate"
          operations:
            - name: get-candidate
              method: GET
              description: "Get a single candidate by ID."
              inputParameters:
                - name: integrated_account_id
                  in: query
                  type: string
                  required: true
                - name: id
                  in: path
                  type: string
                  required: true
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
        - name: applications
          path: /applications
          description: "Job applications"
          operations:
            - name: list-applications
              method: GET
              description: "List job applications."
              inputParameters:
                - name: integrated_account_id
                  in: query
                  type: string
                  required: true
                - name: job_id
                  in: query
                  type: string
                  required: false
                - name: candidate_id
                  in: query
                  type: string
                  required: false
                - name: status
                  in: query
                  type: string
                  required: false
                - name: cursor
                  in: query
                  type: string
                  required: false
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
        - name: offers
          path: /offers
          description: "Job offers"
          operations:
            - name: list-offers
              method: GET
              description: "List job offers."
              inputParameters:
                - name: integrated_account_id
                  in: query
                  type: string
                  required: true
                - name: application_id
                  in: query
                  type: string
                  required: false
                - name: status
                  in: query
                  type: string
                  required: false
                - name: cursor
                  in: query
                  type: string
                  required: false
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
        - name: departments
          path: /departments
          description: "ATS departments"
          operations:
            - name: list-departments
              method: GET
              description: "List departments."
              inputParameters:
                - name: integrated_account_id
                  in: query
                  type: string
                  required: true
                - name: cursor
                  in: query
                  type: string
                  required: false
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."

  exposes:
    - type: rest
      port: 8102
      namespace: truto-ats-api
      resources:
        - path: /v1/ats/jobs
          name: jobs
          description: "Job postings"
          operations:
            - method: GET
              name: list-jobs
              description: "List jobs"
              call: "truto-ats.list-jobs"
              outputParameters:
                - type: object
                  mapping: "$."
        - path: /v1/ats/candidates
          name: candidates
          description: "Candidates"
          operations:
            - method: GET
              name: list-candidates
              description: "List candidates"
              call: "truto-ats.list-candidates"
              outputParameters:
                - type: object
                  mapping: "$."
        - path: /v1/ats/applications
          name: applications
          description: "Applications"
          operations:
            - method: GET
              name: list-applications
              description: "List applications"
              call: "truto-ats.list-applications"
              outputParameters:
                - type: object
                  mapping: "$."

    - type: mcp
      port: 9102
      namespace: truto-ats-mcp
      transport: http
      tools:
        - name: list-jobs
          description: "List job postings from a connected ATS provider with status and department filtering."
          hints:
            readOnly: true
            openWorld: false
          call: "truto-ats.list-jobs"
          with:
            integrated_account_id: "tools.integrated_account_id"
            status: "tools.status"
            department_id: "tools.department_id"
            cursor: "tools.cursor"
            limit: "tools.limit"
          outputParameters:
            - type: object
              mapping: "$."
        - name: list-candidates
          description: "List candidate profiles from a connected ATS provider."
          hints:
            readOnly: true
            openWorld: false
          call: "truto-ats.list-candidates"
          with:
            integrated_account_id: "tools.integrated_account_id"
            cursor: "tools.cursor"
            limit: "tools.limit"
          outputParameters:
            - type: object
              mapping: "$."
        - name: get-candidate
          description: "Get a single candidate record by ID from a connected ATS provider."
          hints:
            readOnly: true
            openWorld: false
          call: "truto-ats.get-candidate"
          with:
            integrated_account_id: "tools.integrated_account_id"
            id: "tools.id"
          outputParameters:
            - type: object
              mapping: "$."
        - name: list-applications
          description: "List job applications from a connected ATS with job, candidate, and status filtering."
          hints:
            readOnly: true
            openWorld: false
          call: "truto-ats.list-applications"
          with:
            integrated_account_id: "tools.integrated_account_id"
            job_id: "tools.job_id"
            candidate_id: "tools.candidate_id"
            status: "tools.status"
          outputParameters:
            - type: object
              mapping: "$."
        - name: list-offers
          description: "List job offers from a connected ATS with application and status filtering."
          hints:
            readOnly: true
            openWorld: false
          call: "truto-ats.list-offers"
          with:
            integrated_account_id: "tools.integrated_account_id"
            application_id: "tools.application_id"
            status: "tools.status"
          outputParameters:
            - type: object
              mapping: "$."
        - name: list-departments
          description: "List departments from a connected ATS provider."
          hints:
            readOnly: true
            openWorld: false
          call: "truto-ats.list-departments"
          with:
            integrated_account_id: "tools.integrated_account_id"
          outputParameters:
            - type: object
              mapping: "$."
