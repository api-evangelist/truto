naftiko: 1.0.0-alpha2
info:
  label: Truto Unified HRIS API — Groups
  description: 'Truto Unified HRIS API — Groups. 1 operations. Lead operation: List groups. Self-contained Naftiko capability
    covering one Truto business surface.'
  tags:
  - Truto
  - Groups
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    TRUTO_API_KEY: TRUTO_API_KEY
capability:
  consumes:
  - type: http
    namespace: unified-hris-groups
    baseUri: https://api.truto.one/unified/hris
    description: Truto Unified HRIS API — Groups business capability. Self-contained, no shared references.
    resources:
    - name: groups
      path: /groups
      operations:
      - name: listgroups
        method: GET
        description: List groups
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: type
          in: query
          type: string
          description: Filter groups by type (department, team, cost_center).
        - name: cursor
          in: query
          type: string
        - name: limit
          in: query
          type: integer
    authentication:
      type: bearer
      token: '{{env.TRUTO_API_KEY}}'
  exposes:
  - type: rest
    namespace: unified-hris-groups-rest
    port: 8080
    description: REST adapter for Truto Unified HRIS API — Groups. One Spectral-compliant resource per consumed operation,
      prefixed with /v1.
    resources:
    - path: /v1/groups
      name: groups
      description: REST surface for groups.
      operations:
      - method: GET
        name: listgroups
        description: List groups
        call: unified-hris-groups.listgroups
        with:
          type: rest.type
          cursor: rest.cursor
          limit: rest.limit
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: unified-hris-groups-mcp
    port: 9090
    transport: http
    description: MCP adapter for Truto Unified HRIS API — Groups. One tool per consumed operation, routed inline through this
      capability's consumes block.
    tools:
    - name: list-groups
      description: List groups
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: unified-hris-groups.listgroups
      with:
        type: tools.type
        cursor: tools.cursor
        limit: tools.limit
      outputParameters:
      - type: object
        mapping: $.
