naftiko: 1.0.0-alpha2
info:
  label: Truto Unified HRIS API — Employments
  description: 'Truto Unified HRIS API — Employments. 1 operations. Lead operation: List employments. Self-contained Naftiko
    capability covering one Truto business surface.'
  tags:
  - Truto
  - Employments
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    TRUTO_API_KEY: TRUTO_API_KEY
capability:
  consumes:
  - type: http
    namespace: unified-hris-employments
    baseUri: https://api.truto.one/unified/hris
    description: Truto Unified HRIS API — Employments business capability. Self-contained, no shared references.
    resources:
    - name: employments
      path: /employments
      operations:
      - name: listemployments
        method: GET
        description: List employments
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: employee_id
          in: query
          type: string
          description: Filter employments by employee ID.
        - name: cursor
          in: query
          type: string
          description: Cursor for pagination.
        - name: limit
          in: query
          type: integer
          description: Number of results per page.
    authentication:
      type: bearer
      token: '{{env.TRUTO_API_KEY}}'
  exposes:
  - type: rest
    namespace: unified-hris-employments-rest
    port: 8080
    description: REST adapter for Truto Unified HRIS API — Employments. One Spectral-compliant resource per consumed operation,
      prefixed with /v1.
    resources:
    - path: /v1/employments
      name: employments
      description: REST surface for employments.
      operations:
      - method: GET
        name: listemployments
        description: List employments
        call: unified-hris-employments.listemployments
        with:
          employee_id: rest.employee_id
          cursor: rest.cursor
          limit: rest.limit
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: unified-hris-employments-mcp
    port: 9090
    transport: http
    description: MCP adapter for Truto Unified HRIS API — Employments. One tool per consumed operation, routed inline through
      this capability's consumes block.
    tools:
    - name: list-employments
      description: List employments
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: unified-hris-employments.listemployments
      with:
        employee_id: tools.employee_id
        cursor: tools.cursor
        limit: tools.limit
      outputParameters:
      - type: object
        mapping: $.
