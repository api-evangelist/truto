principles:
  - name: Visibility
    description: Visibility is per-connector — track which connectors are active and how many accounts
      they cover via the Truto dashboard; the invoice line maps directly to connector count.
  - name: Allocation
    description: Allocate cost per connector to the product or feature that consumes it (e.g. CRM connector
      to RevOps, ATS connector to People Ops); active-account billing means deactivating unused accounts
      reduces effective cost.
  - name: Optimization
    description: Cost levers are connector-count discipline (do not enable connectors you do not actively
      use), tier downgrade where Enterprise-only features (single tenant, on-prem, 90-day logs) are not
      required, and consolidating environments within the 5-environment Expansion cap.
  - name: Accountability
    description: Each connector should have an engineering or product owner responsible for justifying
      its renewal; finance reviews the annual per-connector roster at contract anniversary.
