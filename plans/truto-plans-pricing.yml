description: Truto sells a unified-API integration platform priced per connector per year, with two paid
  tiers — Expansion and Enterprise — billed only on active accounts. Both tiers include unlimited connections,
  unlimited companies, and unlimited API calls; Enterprise unlocks the broader connector catalog, longer
  log retention, single tenancy / on-prem, SSO, and SLA. A 14-day free trial (credit card required) is
  available.
